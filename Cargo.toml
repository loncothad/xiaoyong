[workspace]
resolver = "3"
members = [ "crates/*" ]

[workspace.package]
publish = true
authors = [ "loncothad <me@loncothad.cc>" ]
repository = "https://github.com/loncothad/xiaoyong"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { features = [ "macros", "rt-multi-thread", "test-util" ], version = "1" }
smallvec = "1"
triomphe = "0.1"
crossbeam-utils = "0.8"
futures = "0.3"
event-listener = "5"

[workspace.lints.rust]
non_ascii_idents = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
